services:

  backend:
    build: ./apps
    container_name: backend
    restart: always
    links:
      - db
    ports:
      - "3000"
    volumes:
      - app-data:/apps/public/images

  db:
    image: "mariadb"
    container_name: db
    restart: always
    links:
      - phpmyadmin
    ports:
      - "3306"
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=training
      - MYSQL_USER=peserta
      - MYSQL_PASSWORD=password
    volumes:
      - ./apps/database/:/docker-entrypoint-initdb.d
      - db-data:/var/lib/mysql

  phpmyadmin:
    image: "phpmyadmin"
    container_name: phpmyadmin
    restart: always
    ports:
      - "7080:80"
    environment:
      - PMA_HOST=db

  web:
    build: ./nginx
    container_name: web
    restart: always
    ports:
    - "80:80"
    depends_on:
    - backend

volumes:
  app-data:
  db-data:
